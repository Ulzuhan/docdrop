# Minimal deployment. Uploaded files live in a named volume, so replacing the
# container never loses them.
services:
  docdrop:
    image: ghcr.io/ulzuhan/docdrop:latest
    # To build from a checkout instead of pulling the published image:
    # build: .
    container_name: docdrop
    restart: unless-stopped
    # Published on loopback only: put a tunnel or a reverse proxy in front rather
    # than exposing the port to the whole network.
    ports:
      - "127.0.0.1:3010:3010"
    volumes:
      - docdrop-data:/data
    environment:
      # OBLIGATORIAS. Sin ellas la aplicación no deja entrar a nadie: el modo de
      # contraseña local se retiró y NO hay modo abierto al que caer — un endpoint
      # de subida al alcance de cualquiera es alojamiento anónimo gratis.
      #   DOCDROP_SESSION_SECRET: firma las cookies (openssl rand -hex 32)
      # DOCDROP_SESSION_SECRET: ""
      # DOCDROP_OIDC_CLIENT_ID: ""
      # DOCDROP_OIDC_CLIENT_SECRET: ""
      # DOCDROP_OIDC_REDIRECT_URI: "https://ejemplo/api/auth/callback"
      # DOCDROP_OIDC_PUBLIC_BASE: "https://auth.ejemplo"
      # DOCDROP_OIDC_INTERNAL_BASE: "http://127.0.0.1:9100"
      DOCDROP_MAX_FILE_BYTES: "10737418240"   # 10 GB per file
      DOCDROP_MAX_TOTAL_BYTES: "21474836480"  # 20 GB total
    # Hardening: the app only needs to read its own code and write to /data.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    cap_drop:
      - ALL

  # ── Optional: expose it through a tunnel, no ports on the host ──────
  #
  # With this service enabled you can drop the `ports:` block above entirely: the
  # tunnel reaches DocDrop over the internal compose network, so nothing is bound on
  # the host at all. cloudflared sets X-Forwarded-For to the real client IP, which is
  # what the rate limiter reads.
  #
  # Quick tunnel (throwaway URL, printed in the logs — good for one-off sharing):
  #
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate --url http://docdrop:3010
  #   depends_on: [docdrop]
  #
  # Named tunnel on your own domain (stable URL; create the tunnel first and put its
  # token in the environment):
  #
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on: [docdrop]

volumes:
  docdrop-data:
