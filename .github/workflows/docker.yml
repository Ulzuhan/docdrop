name: Publish container image

# A release calls the functional CI at this exact tag/commit. Its one OCI
# artifact is tested and scanned before the publisher receives write permissions.
# Branches, PRs and manual runs can never publish or promote an image.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: docdrop-publication
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  publish:
    needs: ci
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'Ulzuhan/docdrop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      DIGEST: ${{ needs.ci.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docdrop-oci-${{ github.run_id }}
          path: ${{ runner.temp }}/transfer
      - name: Verify the gated layout after transfer
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y skopeo
          tar -C "$RUNNER_TEMP/transfer" -xf "$RUNNER_TEMP/transfer/docdrop-oci.tar"
          python3 scripts/oci-release.py verify --layout "$RUNNER_TEMP/transfer/docdrop.oci" --digest "$DIGEST" --source "$GITHUB_SHA"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Copy the gated bytes to a unique candidate tag
        run: python3 scripts/oci-release.py candidate --layout "$RUNNER_TEMP/transfer/docdrop.oci" --digest "$DIGEST" --source "$GITHUB_SHA"
      # BuildKit provenance/SBOM stay inside the identical OCI index. This
      # additional GitHub attestation is signed with this workflow's OIDC identity.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/ulzuhan/docdrop
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: Verify the signed subject, source and tag before promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://ghcr.io/ulzuhan/docdrop@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/docker.yml" \
            --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners
      - name: Promote the same digest to release tags, never rebuild
        run: python3 scripts/oci-release.py promote --layout "$RUNNER_TEMP/transfer/docdrop.oci" --digest "$DIGEST" --source "$GITHUB_SHA"
