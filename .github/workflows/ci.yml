name: CI

# Lint, types and the upload-protocol suite on every push and PR. The container
# workflow only proves the image builds; this one proves the code works.
#
# Two orderings that are not obvious:
#
# - `tsc --noEmit` must run AFTER `next build`, because Next generates the types
#   the routes rely on (RouteContext in .next/types) during the build. Running it
#   first fails with TS2304 on every dynamic route.
# - The protocol suite runs against an already running server, by design (it is
#   what verifies start.js raising the request timeout, not a mock). PORT is set
#   on both sides: the server would otherwise listen on Next's default 3000 while
#   the suite probes 3010.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PORT: 3010
      # Un secreto de usar y tirar, solo para que la suite pueda firmarse una
      # sesión: subir dejó de ser público al mudar la identidad a Authentik.
      # No abre nada — el servidor de CI vive noventa segundos y muere.
      DOCDROP_SESSION_SECRET: ci-only-docdrop-secret-at-least-32-bytes

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # node:22 to match the runtime image in the Dockerfile.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npx tsc --noEmit

      # La suite del cifrado no necesita servidor: es el módulo a solas, con el
      # custodio malicioso como adversario. Si esto falla, nada más importa.
      - run: npx vitest run

      # Con un proveedor de mentira que FIRMA de verdad: el aviso de cierre de
      # sesión no se puede probar de otra forma.
      - run: npm run test:backchannel

      - name: Run the upload-protocol suite against the built server
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -sf "http://127.0.0.1:$PORT/" >/dev/null && break
            sleep 1
          done
          npm run test:upload
