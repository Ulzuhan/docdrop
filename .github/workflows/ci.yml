name: CI


# One Go backend and one React frontend. The published Node image is used
# only by the pinned rollback compatibility test, never built from this tree.
# Every HTTP suite uses its own temporary store. Browser tests exercise both
# the binary and final image, including the encrypted download journey.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      digest:
        description: Exact tested and scanned OCI index
        value: ${{ jobs.imagen.outputs.digest }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:web
      - run: npm run test:unit
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: A release tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF#refs/tags/v}" = "$(node -p 'require("./package.json").version')"

  go:
    runs-on: ubuntu-latest
    env:
      DOCDROP_SESSION_SECRET: ci-only-docdrop-secret-at-least-32-bytes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false

      - run: go vet ./cmd/... ./internal/...

      # -race porque lo que aquí se rompe son carreras: dos descargas sobre el
      # último permiso, dos subidas sobre el último hueco de cuota, y una parada
      # mientras hay transferencias en vuelo.
      - run: go test -race ./cmd/... ./internal/...

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # La interfaz se construye aquí y se embebe en el binario.
      - run: npm run build:web

      - run: go build -o docdrop ./cmd/docdrop

      # Contratos HTTP contra el backend único.
      - name: Suites HTTP contra el binario
        env:
          DOCDROP_TEST_LAUNCH: ./docdrop
          DOCDROP_TEST_BUILD_STAMP: ./docdrop
        run: ./scripts/run-suites.sh

      - name: Aviso de cierre de sesión contra el binario
        env:
          DOCDROP_TEST_LAUNCH: ./docdrop
        run: bash scripts/test-backchannel.sh

      # El recorrido de navegador contra el binario, con navegador de verdad.
      # Playwright es dependencia de desarrollo con versión fijada y NO entra en
      # la imagen; los navegadores se instalan sólo aquí.
      - run: npx playwright install --with-deps chromium

      - name: Recorrido de navegador contra el binario
        env:
          DOCDROP_TEST_LAUNCH: ./docdrop
        run: npm run test:navegador

  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.artifact.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: artifact
        uses: ./.github/actions/verified-oci

  artifact-roundtrip:
    needs: imagen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docdrop-oci-${{ github.run_id }}
          path: ${{ runner.temp }}/transfer
      - name: Verify the exact artifact after transfer, without registry writes
        env:
          DIGEST: ${{ needs.imagen.outputs.digest }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y skopeo
          tar -C "$RUNNER_TEMP/transfer" -xf "$RUNNER_TEMP/transfer/docdrop-oci.tar"
          python3 scripts/oci-release.py verify --layout "$RUNNER_TEMP/transfer/docdrop.oci" --digest "$DIGEST" --source "$GITHUB_SHA"

  compatibilidad:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build:web

      - run: go build -o docdrop ./cmd/docdrop

      # El digest está fijado dentro del script. Se comprueba aquí que sigue
      # existiendo antes de correr nada: si algún día se retirara del registro,
      # el fallo tiene que decir eso y no perderse dentro de la suite.
      - name: Traer la imagen de vuelta atrás
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/ulzuhan/docdrop@sha256:525ef454305d7455c774d4463d11feb029ba8091ef4b83508a7b4002c19f0f67

      # Node publicado → Go → el MISMO Node, por turnos y sobre un solo almacén.
      # Es el camino de la vuelta atrás, y si esto falla el despliegue no se
      # puede deshacer sin perder datos.
      - name: Compatibilidad contra el digest exacto de vuelta atrás
        env:
          DOCDROP_TEST_LAUNCH: ./docdrop
        run: ./scripts/test-compatibilidad.sh
